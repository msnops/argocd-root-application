apiVersion: v2
name: root-application
description: >
  Templated root Argo CD Application. One instance is rendered per cluster /
  dedicated GitOps agent by supplying that cluster's values (normally
  eks_new/clusters/<cluster>/cluster_values.yaml). The rendered Application
  is the single object bootstrapped onto that agent; it in turn deploys the
  `applicationsets` chart (Layer 2), which fans out into the per-app
  Applications defined in app-catalog/ (Layer 3).
type: application
version: 0.1.0
appVersion: "1.0"
