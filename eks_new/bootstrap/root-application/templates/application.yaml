apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: {{ include "root-application.name" . }}
  namespace: {{ required "gitopsNamespace is required" .Values.gitopsNamespace }}

  labels:
    gitops.harness.io/cluster: {{ required "cluster.name is required" .Values.cluster.name | quote }}
    gitops.harness.io/environment: {{ required "cluster.environment is required" .Values.cluster.environment | quote }}
    gitops.harness.io/gitops-agent-id: {{ .Values.cluster.gitopsAgentId | quote }}

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: {{ required "cluster.project is required" .Values.cluster.project | quote }}

  sources:
    #
    # Layer 2: the applicationsets chart. This ApplicationSet reads this
    # same cluster's cluster_values.yaml (merged over the environment
    # defaults) and fans out into the per-app Applications from Layer 3.
    #
    - repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
      targetRevision: {{ .Values.targetRevision | default "main" | quote }}
      path: {{ required "applicationSetChartPath is required" .Values.applicationSetChartPath | quote }}

      helm:
        releaseName: {{ include "root-application.name" . }}

        valueFiles:
          - '$values/eks_new/environments/{{ .Values.cluster.environment }}/values.yaml'
          - '$values/eks_new/clusters/{{ .Values.cluster.name }}/cluster_values.yaml'

        parameters:
          - name: clusterName
            value: {{ .Values.cluster.name | quote }}
          - name: gitopsAgentId
            value: {{ .Values.cluster.gitopsAgentId | quote }}
          - name: gitopsNamespace
            value: {{ .Values.gitopsNamespace | quote }}
          - name: repoURL
            value: {{ .Values.repoURL | quote }}
          - name: targetRevision
            value: {{ .Values.targetRevision | default "main" | quote }}
          - name: applicationSet.requeueAfterSeconds
            value: {{ .Values.applicationSet.requeueAfterSeconds | default 60 | quote }}

    #
    # Values repository (so $values/... refs above resolve)
    #
    - repoURL: {{ .Values.repoURL | quote }}
      targetRevision: {{ .Values.targetRevision | default "main" | quote }}
      ref: values

  destination:
    server: {{ .Values.cluster.server | default "https://kubernetes.default.svc" | quote }}
    namespace: {{ .Values.gitopsNamespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
