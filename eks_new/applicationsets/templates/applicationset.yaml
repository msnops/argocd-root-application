apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: gitops-agent-{{ required "gitopsAgentId is required" .Values.gitopsAgentId | lower | replace "_" "-" }}
  namespace: {{ required "gitopsNamespace is required" .Values.gitopsNamespace }}

spec:
  goTemplate: true

  goTemplateOptions:
    - missingkey=error

  selector:
    matchExpressions:
      - key: appset.harness.io/enabled
        operator: In
        values:
          - "true"

  syncPolicy:
    preserveResourcesOnDeletion: {{ .Values.applicationSet.preserveResourcesOnDeletion | default false }}

  {{- if .Values.applicationSet.progressiveSync.enabled }}
  # Progressive Syncs: creates/syncs apps one step at a time, in this order.
  # ArgoCD waits for each step's app(s) to be Synced + Healthy before moving on.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        {{- range .Values.applicationSet.progressiveSync.order }}
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - {{ . | quote }}
          maxUpdate: 1
        {{- end }}
  {{- end }}

  generators:
    - matrix:
        generators:

          #
          # CLUSTER
          #
          # The root Application passes clusterName into this Helm chart.
          # The Git generator then reads that cluster's cluster_values.yaml.
          #
          - git:
              repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | default "main" | quote }}
              requeueAfterSeconds: {{ .Values.applicationSet.requeueAfterSeconds | default 60 }}

              files:
                - path: eks_new/clusters/{{ required "clusterName is required" .Values.clusterName }}/cluster_values.yaml

          #
          # APPLICATIONS
          #
          # Effective app set for this cluster =
          #
          # environmentApps (baseline, from environments/<env>/values.yaml)
          # overridden by clusterApps (true/false map, from clusters/<cluster>/cluster_values.yaml)
          #
          - git:
              repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
              revision: {{ .Values.targetRevision | default "main" | quote }}
              requeueAfterSeconds: {{ .Values.applicationSet.requeueAfterSeconds | default 60 }}

              files:
{{- $apps := dict }}

{{- range (.Values.environmentApps | default list) }}
{{- $_ := set $apps . true }}
{{- end }}

{{- range $name, $enabled := (.Values.clusterApps | default dict) }}
{{- if $enabled }}
{{- $_ := set $apps $name true }}
{{- else }}
{{- $_ := unset $apps $name }}
{{- end }}
{{- end }}

{{- if eq (len $apps) 0 }}
{{- fail "No applications enabled. Check environmentApps and clusterApps values." }}
{{- end }}

{{- range $app := keys $apps | sortAlpha }}
                - path: eks_new/app-catalog/{{ $app }}.yaml
{{- end }}

  template:
    metadata:
      name: '{{`{{ printf "%s-%s" .app.name .cluster.name | normalize }}`}}'

      labels:
        app.kubernetes.io/name: '{{`{{ .app.name }}`}}'
        gitops.harness.io/cluster: '{{`{{ .cluster.name }}`}}'
        gitops.harness.io/environment: '{{`{{ .cluster.environment }}`}}'
        gitops.harness.io/gitops-agent-id: '{{`{{ .cluster.gitopsAgentId }}`}}'

      finalizers:
        - resources-finalizer.argocd.argoproj.io

    spec:
      project: '{{`{{ .cluster.project }}`}}'

      sources:

        #
        # Application chart
        #
        - repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | default "main" | quote }}
          path: '{{`{{ .app.chartPath }}`}}'

          helm:
            releaseName: '{{`{{ .app.releaseName }}`}}'

            ignoreMissingValueFiles: true

            valueFiles:

              #
              # Layer 1: application defaults
              #
              - values.yaml

              #
              # Layer 2: environment defaults
              #
              - '$values/eks_new/environments/{{`{{ .cluster.environment }}`}}/values.yaml'

              #
              # Layer 3: cluster/application overrides
              #
              - '$values/eks_new/clusters/{{`{{ .cluster.name }}`}}/values/{{`{{ .app.valuesFile }}`}}'

        #
        # Values repository
        #
        - repoURL: {{ required "repoURL is required" .Values.repoURL | quote }}
          targetRevision: {{ .Values.targetRevision | default "main" | quote }}
          ref: values

      destination:
        server: '{{`{{ .cluster.server }}`}}'
        namespace: '{{`{{ .app.namespace }}`}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false

        retry:
          limit: 5

          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true

  templatePatch: |
    spec:
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/preserveUnknownFields