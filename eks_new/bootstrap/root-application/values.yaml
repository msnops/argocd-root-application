# -----------------------------------------------------------------------
# Repo-wide defaults. Only override these if a given cluster lives in a
# different repo/branch than the rest of the fleet.
# -----------------------------------------------------------------------
repoURL: https://github.com/msnops/argocd-root-application.git
targetRevision: main
gitopsNamespace: argocd

# Path (within repoURL) to the Layer 2 applicationsets chart.
applicationSetChartPath: eks_new/applicationsets

applicationSet:
  requeueAfterSeconds: 60

# -----------------------------------------------------------------------
# Cluster identity - REQUIRED per instance.
#
# In practice you never write these by hand: pass
#   -f eks_new/clusters/<cluster>/cluster_values.yaml
# at render time, since that file already contains a matching `cluster:`
# block (name, environment, server, project, gitopsAgentId). Left blank
# here so the schema/`required` checks fail loudly if it's omitted.
# -----------------------------------------------------------------------
cluster:
  name: ""
  environment: ""
  server: https://kubernetes.default.svc
  project: ""
  gitopsAgentId: ""
